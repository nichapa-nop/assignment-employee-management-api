# Render Blueprint for the API (free web service).
# Database: Supabase PostgreSQL via the Session pooler (see README "Deploying").
services:
  - type: web
    name: employee-management-api
    runtime: node
    plan: free
    region: singapore
    # Dev dependencies (Nest CLI, TypeScript) are needed to compile, and
    # NODE_ENV=production would otherwise make npm skip them.
    buildCommand: npm ci --include=dev && npm run build
    # Pre-deploy commands are not available on the free plan, so pending
    # migrations are applied on start. Running them is idempotent.
    startCommand: npm run migration:run:prod && npm run start:prod
    healthCheckPath: /api/departments
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      - key: CORS_ORIGIN
        # e.g. https://your-app.vercel.app (comma-separate multiple origins)
        sync: false
      - key: DB_HOST
        # e.g. aws-0-<region>.pooler.supabase.com
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        # e.g. postgres.<project-ref>
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres
      - key: DB_SSL_MODE
        value: verify-full
      - key: DB_SSL_CA
        # Upload the Supabase CA as a Secret File named supabase-ca.crt.
        value: /etc/secrets/supabase-ca.crt
      - key: DB_LOGGING
        value: "false"
